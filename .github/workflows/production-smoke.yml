name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run production smoke check
        working-directory: backend
        env:
          PRODUCTION_SMOKE_TIMEOUT: "20"
          PILOT_BOOKING_PATHS: "/booking/af54b91e-1ff2-456c-a5e4-565d8369e557?program=63c8bdb1-0e09-4a8b-bc2e-7e15e091c151"
        run: python scripts/production_smoke.py
